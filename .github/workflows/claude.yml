# Claude Code trên GitHub — gọi @claude trong issue/PR là Claude đọc repo và trả lời/sửa.
#
# ⚠ File này CHƯA CHẠY ĐƯỢC cho tới khi chủ dự án làm 2 bước MỘT LẦN (từ tài khoản GitHub
# `vanhoang-spec` — tài khoản sở hữu repo, KHÔNG phải hoang-embassy đang đăng nhập trong gh CLI):
#
#   1. Cài GitHub App "Claude" cho repo: https://github.com/apps/claude → Install →
#      chọn vanhoang-spec/tcm-crm. (Hoặc chạy lệnh `/install-github-app` trong Claude Code.)
#   2. Thêm MỘT trong hai secret ở Settings → Secrets and variables → Actions:
#      · CLAUDE_CODE_OAUTH_TOKEN — sinh bằng lệnh `claude setup-token` trên máy dev (dùng gói
#        Claude đang có, không tốn thêm tiền nhưng ăn vào hạn mức gói); HOẶC
#      · ANTHROPIC_API_KEY — API key trả tiền theo token, tách bạch chi phí.
#      Điền secret nào thì action tự dùng secret đó (bên dưới truyền cả hai, cái thiếu là chuỗi rỗng).
#
# Chưa cài App/secret thì workflow chỉ chạy khi có ai gõ "@claude" và sẽ fail vô hại — không ảnh
# hưởng CI hay deploy.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Chỉ chạy khi nội dung thật sự nhắc @claude — không đốt phút Actions cho mọi comment.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # cho phép Claude đọc kết quả CI trên PR để chẩn đoán khi CI đỏ
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
